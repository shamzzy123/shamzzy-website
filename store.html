<!DOCTYPE html>
<html>
  <head>
    <title>shamzzy-store</title>
    <style>
      body{
        background-color: red;
      }
      .welcome{
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        font-size: 60px;
        color: black;
      }
      .shop{
          background-color: black;
          color: white;
          border-radius: 12px;
          padding: 20px 30px;
          cursor: pointer;
        }
        .shop:hover{
          transform: translateY(-10px);
        }
        .image{
          width: 60px;
          height: 40px;
          border-radius: 15px;
        }
    </style>
  </head>
  <body>
    <section>
         <h1 class="welcome">WELCOME TO SHAMZZY STORE</h1>
         <button class="shop">SHOP NOW <img class="image" src="shop.png" alt="my photo"> </button>
    </section>
  </body>
</html>
